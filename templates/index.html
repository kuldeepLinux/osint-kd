<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSINT-KD | Made by Kuldeep</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="terminal">
        <div class="header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">root@osint-kd:~# PRANX-STYLE TOOL</span>
        </div>
        <h1>👾 OSINT-KD v1.0</h1>
        <p class="subtitle">Made with 💚 by <b>Kuldeep</b></p>

        <div class="buttons">
            <button onclick="showInput('phone')">📱 Phone Info</button>
            <button onclick="showInput('ip')">🌐 IP Tracker</button>
            <button onclick="showInput('username')">🔍 Username Search</button>
            <button onclick="showInput('whois')">📡 Domain WHOIS</button>
        </div>

        <div id="inputArea"></div>
        <div class="output" id="output">[+] System Ready... Waiting for input_</div>

        <footer style="text-align:center; margin-top:20px; font-size:12px; color:#00cc00;">
            ⚡ OSINT-KD | Made with 💚 by <b>Kuldeep</b> ⚡<br>
            <a href="https://github.com/YOUR_USERNAME/osint-kd" style="color:#00ff00;">
                github.com/YOUR_USERNAME/osint-kd
            </a>
        </footer>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
